name: DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. SCANNING STAGE
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security: SAST Scan
        run: |
          npm install -g snyk
          snyk test --all-projects || true

  # 2. BUILD STAGE (Runs only if Scan passes)
  build:
    needs: sast-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t devopsengineerr11/mynote:latest .
      
      # Upload the built image to GitHub Artifacts so the next stage can use it
      - name: Save Image
        run: docker save devopsengineerr11/mynote:latest > mynote-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: mynote-image
          path: mynote-image.tar

  # 3. SECURITY SCAN STAGE
  container-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mynote-image
      - name: Load Image
        run: docker load < mynote-image.tar
      - name: Security: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devopsengineerr11/mynote:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

  # 4. DEPLOY STAGE
  push-to-dockerhub:
    needs: container-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mynote-image
      - name: Load Image
        run: docker load < mynote-image.tar
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push to DockerHub
        run: docker push devopsengineerr11/mynote:latest
