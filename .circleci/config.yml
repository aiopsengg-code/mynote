# ─────────────────────────────────────────────────────────────────────────────
# CircleCI Pipeline Configuration — Notes-Keeping App (Final Fixed Version)
# Project: trivediayush/Notes-Keeping (Pure HTML + CSS + JS, no package.json)
# File location: .circleci/config.yml
# ─────────────────────────────────────────────────────────────────────────────

# version 2.1 enables orbs, commands, executors and other modern CircleCI features
version: 2.1

# ─────────────────────────────────────────────────────────────────────────────
# ORBS — pre-packaged reusable CircleCI integrations (like npm packages for CI)
# We only need the docker orb here for building the image
# ─────────────────────────────────────────────────────────────────────────────
orbs:
  docker: circleci/docker@2.4.0

# ─────────────────────────────────────────────────────────────────────────────
# EXECUTORS — reusable execution environment definitions
# Define once, reference by name in any job below
# ─────────────────────────────────────────────────────────────────────────────
executors:
  node-executor:
    # 'docker' executor spins up a container for the job to run inside
    docker:
      # cimg/node is CircleCI's maintained Node image — includes git, curl, etc.
      - image: cimg/node:18.17
    # all commands in jobs using this executor run from this directory
    working_directory: ~/project

# ─────────────────────────────────────────────────────────────────────────────
# COMMANDS — reusable step sequences (like functions you call inside jobs)
# FIX: removed restore_cache / save_cache / npm install entirely
# Reason: this project is pure HTML/CSS/JS with no package.json or node_modules
# Caching npm deps makes no sense here — nothing to cache
# ─────────────────────────────────────────────────────────────────────────────
commands:
  checkout-code:
    description: "Checkout source code — no npm deps needed for this static project"
    steps:
      # 'checkout' is a built-in CircleCI step that clones the repo using a deploy key
      - checkout

      # Confirm to the build log that this is intentionally a no-npm project
      - run:
          name: Confirm project type
          command: |
            echo "================================================"
            echo "  Project: Notes-Keeping (Static HTML/CSS/JS)"
            echo "  No package.json — skipping all npm installs"
            echo "  Branch : $CIRCLE_BRANCH"
            echo "  Commit : $CIRCLE_SHA1"
            echo "  Build  : $CIRCLE_BUILD_NUM"
            echo "================================================"
            ls -la   # list files so we can visually confirm the checkout succeeded

# ─────────────────────────────────────────────────────────────────────────────
# JOBS — individual units of work, each runs in its own fresh container
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ─── JOB 1: CHECKOUT & VALIDATE ───────────────────────────────────────────
  # Checks out the repo and confirms all required project files are present
  # This is the entry point — all other jobs depend on this passing
  # ──────────────────────────────────────────────────────────────────────────
  checkout-and-validate:
    executor: node-executor

    steps:
      # Call our reusable command defined above
      - checkout-code

      - run:
          name: Validate required files exist
          command: |
            echo "=== Checking required project files ==="

            # 'test -f' returns exit code 0 if file exists, 1 if it doesn't
            # The '|| exit 1' causes the job to FAIL if any file is missing
            test -f index.html  && echo "✅ index.html"  || (echo "❌ index.html MISSING"  && exit 1)
            test -f style.css   && echo "✅ style.css"   || (echo "❌ style.css MISSING"   && exit 1)
            test -f script.js   && echo "✅ script.js"   || (echo "❌ script.js MISSING"   && exit 1)
            test -f Dockerfile  && echo "✅ Dockerfile"  || (echo "❌ Dockerfile MISSING"  && exit 1)

            echo "=== All required files present — validation passed ==="

      - run:
          name: Show file sizes (sanity check)
          command: |
            echo "=== File summary ==="
            wc -l index.html style.css script.js   # print line counts for each file
            echo "=== Dockerfile preview (first 5 lines) ==="
            head -5 Dockerfile

      # persist_to_workspace saves the checked-out files so downstream jobs
      # can access them without re-cloning from GitHub
      - persist_to_workspace:
          root: ~/project      # base path to persist from
          paths:
            - .                # persist everything (all files in working_directory)

  # ─── JOB 2: LINT ──────────────────────────────────────────────────────────
  # Runs code quality checks on HTML, JS, and CSS
  # Uses globally installed tools — no local package.json needed
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    executor: node-executor

    steps:
      # attach_workspace restores the files saved by checkout-and-validate above
      - attach_workspace:
          at: ~/project

      - run:
          name: Install HTMLHint globally
          command: |
            # Installing globally (-g) means no package.json is required
            # HTMLHint checks HTML for common mistakes: missing alt attrs,
            # unclosed tags, duplicate IDs, inline styles, etc.
            npm install -g htmlhint
            htmlhint --version   # confirm install succeeded

      - run:
          name: Install ESLint globally
          command: |
            # ESLint is the standard JavaScript linter
            # Installing globally works fine without a local package.json
            npm install -g eslint
            eslint --version

      - run:
          name: Lint HTML — HTMLHint
          command: |
            echo "=== HTMLHint results for index.html ==="
            # Run HTMLHint and show results. '|| true' means a lint warning
            # won't fail the build — good for learning. Remove it in production
            # to enforce strict linting.
            htmlhint index.html || true
            echo "=== HTMLHint complete ==="

      - run:
          name: Lint JavaScript — ESLint
          command: |
            echo "=== ESLint results for script.js ==="
            # --env browser   : tells ESLint that window, document, alert etc. are valid
            # --env es6       : allows arrow functions, let, const, template literals
            # --no-eslintrc   : ignore any .eslintrc file; use only our inline flags
            # --rule          : turn on a specific rule inline
            # '|| true'       : don't fail the build on lint warnings (remove for production)
            eslint \
              --env browser \
              --env es6 \
              --no-eslintrc \
              --rule '{"no-undef": "warn", "no-unused-vars": "warn"}' \
              script.js || true
            echo "=== ESLint complete ==="

      - run:
          name: Lint CSS — basic checks
          command: |
            echo "=== CSS basic validation ==="
            # test -s checks the file exists AND is non-empty (size > 0)
            test -s style.css \
              && echo "✅ style.css exists and is non-empty" \
              || (echo "❌ style.css is empty or missing" && exit 1)

            # Count CSS rule blocks as a sanity check
            RULE_COUNT=$(grep -c '{' style.css || true)
            echo "CSS rule blocks found: $RULE_COUNT"
            echo "=== CSS check complete ==="

  # ─── JOB 3: TEST ──────────────────────────────────────────────────────────
  # Runs structural and content tests against the HTML/JS/CSS files
  # Uses the machine executor (full Ubuntu VM) for a more realistic environment
  # ──────────────────────────────────────────────────────────────────────────
  test:
    # 'machine' gives a full Ubuntu VM instead of a lightweight Docker container
    # Useful here because we have full OS control without Docker-in-Docker issues
    machine:
      image: ubuntu-2204:current

    steps:
      - checkout   # re-checkout since machine executor doesn't share docker workspace

      - run:
          name: Setup Node.js via nvm
          command: |
            # nvm (Node Version Manager) is pre-installed on CircleCI machine images
            # We source it first so the 'nvm' command is available in this shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm install 18
            nvm use 18
            nvm alias default 18   # make v18 the default for all subsequent steps
            node --version
            npm --version

      - run:
          name: Test — HTML structure validation
          command: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 18

            echo "=== HTML Structure Tests ==="

            # Test 1: required HTML skeleton tags
            grep -qi '<html'   index.html && echo "✅ <html> tag found"  || (echo "❌ <html> missing"  && exit 1)
            grep -qi '<head'   index.html && echo "✅ <head> tag found"  || (echo "❌ <head> missing"  && exit 1)
            grep -qi '<body'   index.html && echo "✅ <body> tag found"  || (echo "❌ <body> missing"  && exit 1)
            grep -qi '</html>' index.html && echo "✅ closing </html>"   || (echo "❌ </html> missing" && exit 1)

            # Test 2: CSS and JS are properly linked in index.html
            grep -q 'style.css'  index.html && echo "✅ style.css linked"  || echo "⚠️  style.css not linked in HTML"
            grep -q 'script.js'  index.html && echo "✅ script.js linked"  || echo "⚠️  script.js not linked in HTML"

            # Test 3: page has a <title> tag (good for SEO and UX)
            grep -qi '<title' index.html && echo "✅ <title> tag found" || echo "⚠️  No <title> tag"

            echo "=== HTML tests complete ==="

      - run:
          name: Test — Notes app feature presence
          command: |
            echo "=== Feature Tests ==="

            # Test that notes-related keywords exist somewhere in the project files
            # This is a lightweight content test — not full unit testing, but useful
            grep -qi 'note'              index.html         && echo "✅ 'note' keyword in HTML"    || echo "⚠️  'note' not found in HTML"
            grep -qi 'delete'            index.html script.js && echo "✅ delete feature found"   || echo "⚠️  delete not found"
            grep -qi 'add\|create\|new'  index.html script.js && echo "✅ add/create feature found" || echo "⚠️  add feature not found"

            echo "=== Feature tests complete ==="

      - run:
          name: Test — JavaScript syntax check
          command: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 18

            echo "=== JavaScript Syntax Check ==="
            # 'node --check' parses the JS file for syntax errors WITHOUT running it
            # This is a zero-dependency syntax validator — catches broken JS immediately
            node --check script.js \
              && echo "✅ script.js has no syntax errors" \
              || (echo "❌ script.js has syntax errors" && exit 1)
            echo "=== JS syntax check complete ==="

      - run:
          name: Test — CSS brace balance check
          command: |
            echo "=== CSS Sanity Check ==="

            # Count opening and closing braces — they should match in valid CSS
            OPEN=$(grep -o '{' style.css | wc -l)
            CLOSE=$(grep -o '}' style.css | wc -l)
            echo "Opening braces { : $OPEN"
            echo "Closing braces } : $CLOSE"

            if [ "$OPEN" -eq "$CLOSE" ]; then
              echo "✅ CSS brace count matches ($OPEN open, $CLOSE close)"
            else
              echo "⚠️  CSS brace mismatch — possible syntax error"
            fi
            echo "=== CSS check complete ==="

      # store_artifacts uploads files to CircleCI so you can download them
      # from the Artifacts tab on the job detail page
      - store_artifacts:
          path: ~/project
          destination: source-snapshot

  # ─── JOB 4: BUILD DOCKER IMAGE ─────────────────────────────────────────────
  # Builds the Docker image from the repo's Dockerfile
  # NOTE: Docker push intentionally removed — image is built and tested only
  # ──────────────────────────────────────────────────────────────────────────
  build-docker:
    docker:
      # cimg/base is a minimal CircleCI image that has Docker CLI pre-installed
      - image: cimg/base:stable

    steps:
      - checkout

      # setup_remote_docker creates a separate, isolated Docker engine for this job
      # Required on CircleCI when you want to run 'docker build' inside a container
      # This solves the Docker-in-Docker security problem safely
      - setup_remote_docker:
          version: docker23

      - run:
          name: Build Docker image
          command: |
            echo "=== Building Docker image ==="

            # Tag with the git commit SHA — every build gets a unique, traceable tag
            # $CIRCLE_SHA1 is a built-in CircleCI env var for the full git commit hash
            docker build -t notes-keeping:$CIRCLE_SHA1 .
            docker build -t notes-keeping:latest .

            echo "=== Build complete ==="

      - run:
          name: Verify Docker image was created
          command: |
            echo "=== Verifying image exists ==="
            # 'docker images' lists all local images — filter to confirm ours is there
            docker images | grep notes-keeping
            echo "=== Image verified ==="

      - run:
          name: Smoke test — run the container
          command: |
            echo "=== Container smoke test ==="

            # Start the container detached (-d) and map port 80 inside to 8080 outside
            docker run -d --name notes-smoke-test -p 8080:80 notes-keeping:latest

            # Give the container 3 seconds to fully start up
            sleep 3

            # Check the container is still running (didn't crash on startup)
            docker ps | grep notes-smoke-test \
              && echo "✅ Container is running" \
              || (echo "❌ Container crashed on startup" && exit 1)

            # Print the container logs — useful for debugging if something goes wrong
            echo "=== Container logs ==="
            docker logs notes-smoke-test

            # Clean up — stop and remove the test container
            docker stop notes-smoke-test
            docker rm   notes-smoke-test

            echo "=== Smoke test passed — Docker image is healthy ==="

      - run:
          name: Show final image details
          command: |
            echo "=== Final image info ==="
            docker inspect notes-keeping:latest \
              --format='Size: {{.Size}} bytes | Created: {{.Created}}'

  # ─── JOB 5: DEPLOY (SIMULATED) ────────────────────────────────────────────
  # Simulates a deployment step with a clear summary of what ran
  # Replace the echo commands here with your real deploy script later
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    executor: node-executor

    steps:
      # Restore the workspace files saved by checkout-and-validate
      - attach_workspace:
          at: ~/project

      - run:
          name: Deployment summary
          command: |
            echo "=============================================="
            echo "  DEPLOYMENT SUMMARY"
            echo "  Project  : Notes-Keeping App"
            echo "  Branch   : $CIRCLE_BRANCH"
            echo "  Commit   : $CIRCLE_SHA1"
            echo "  Build #  : $CIRCLE_BUILD_NUM"
            echo "  Triggered: $CIRCLE_USERNAME"
            echo "=============================================="
            echo ""
            echo "All pipeline stages completed:"
            echo "  ✅ Checkout & Validate"
            echo "  ✅ Lint (HTML + JS + CSS)"
            echo "  ✅ Test (structure + syntax + features)"
            echo "  ✅ Docker Build + Smoke Test"
            echo "  ✅ Deploy (simulated)"
            echo ""
            echo "In a real deployment this step would run one of:"
            echo "  → ssh user@server 'docker pull && docker-compose up -d'"
            echo "  → kubectl set image deployment/notes notes=notes-keeping:$CIRCLE_SHA1"
            echo "  → aws ecs update-service --cluster prod --service notes"
            echo ""
            echo "✅ Pipeline complete!"

      # 'when: always' means this step runs even if a previous step failed
      # Great for notifications — you always want to know the final status
      - run:
          name: Final status notification
          when: always
          command: |
            echo "Pipeline finished — exit status of previous step: $?"
            # In production, replace with a real Slack/email webhook:
            # curl -X POST "$SLACK_WEBHOOK_URL" \
            #   -H 'Content-type: application/json' \
            #   --data '{"text":"Notes-Keeping deploy complete on '$CIRCLE_BRANCH'"}'

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOWS — defines the order and conditions for running jobs
# This is the DAG (Directed Acyclic Graph) of your pipeline
# ─────────────────────────────────────────────────────────────────────────────
workflows:
  notes-keeping-pipeline:
    jobs:

      # Step 1 — runs immediately on every push, no dependencies
      - checkout-and-validate

      # Step 2 — runs AFTER checkout passes, in parallel with test
      - lint:
          requires:
            - checkout-and-validate

      # Step 3 — runs AFTER checkout passes, in parallel with lint
      - test:
          requires:
            - checkout-and-validate

      # Step 4 — runs only after BOTH lint AND test pass
      # Also restricted to main and develop branches only
      - build-docker:
          requires:
            - lint
            - test
          filters:
            branches:
              only:
                - main
                - develop

      # Step 5 — runs only after Docker build passes, and only on main
      - deploy:
          requires:
            - build-docker
          filters:
            branches:
              only:
                - main

# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE EXECUTION FLOW:
#
#  Every branch:
#  [checkout-and-validate] → [lint] + [test]  (parallel)
#
#  develop branch only:
#  ... → [lint] + [test] → [build-docker]
#
#  main branch only:
#  ... → [lint] + [test] → [build-docker] → [deploy]
#
# ─────────────────────────────────────────────────────────────────────────────
